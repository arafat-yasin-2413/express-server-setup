services:
  # Application service. The `target: dev` line builds the development
  # image (includes tsx and dev tooling); the runner stage of the
  # Dockerfile is unused in development.
  app:
    build:
      context: .
      dockerfile: Dockerfile

      container_name: setup-app    

    ports:
      - 5000:5000 
    
    env_file:
      - .env

    environment:
      - DATABASE_URL: postgres://postgres:12345@postgres:5432/setup_db
      
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: setup-postgres 
    restart: always
    user: postgres
    secrets:
      - db-password


    
    
    environment:
      POSTGRES_SERVER:db
      POSTGRES_USER:postgres
      POSTGRES_DB:setup_db
      POSTGRES_PASSWORD:12345
    
    
    ports:
      -"5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt